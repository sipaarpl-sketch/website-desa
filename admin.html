<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Desa Pusaka</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background-color: #f4f7f4;">

    <!-- Navbar Sederhana Admin -->
    <header class="navbar">
        <div class="container nav-container">
            <div class="logo">
                <span class="logo-icon">🔒</span>
                <div class="logo-text">
                    <span class="brand-title">ADMIN PANEL</span>
                    <span class="brand-sub">Desa Pusaka</span>
                </div>
            </div>
            <button id="btnLogout" onclick="logout()" style="display:none; background:#d9534f; color:white; border:none; padding:8px 16px; border-radius:5px; cursor:pointer; font-weight:600;">Keluar (Logout)</button>
        </div>
    </header>

    <!-- FORM LOGIN PASSWORD -->
    <div id="loginSection" class="container" style="max-width: 400px; margin: 80px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">
        <h2 style="color: #1b4d2e; text-align: center; margin-bottom: 20px;">Masuk Sistem Admin</h2>
        <form onsubmit="checkPassword(event)">
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: 600; margin-bottom: 5px; color: #333;">Masukkan Password Admin:</label>
                <input type="password" id="adminPassword" placeholder="Password..." required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
            </div>
            <p id="errorMsg" style="color: red; font-size: 0.85rem; display: none; margin-bottom: 10px;">Password salah! Coba lagi.</p>
            <button type="submit" class="btn-primary" style="width: 100%; border: none; padding: 12px; cursor: pointer;">Masuk</button>
        </form>
    </div>

    <!-- DASHBOARD DATA (Tersembunyi Sebelum Login) -->
    <div id="adminContent" class="container" style="display: none; padding: 40px 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="color: #1b4d2e; margin: 0;">Rekap Aspirasi & Pesan Warga</h2>
            <button onclick="loadData()" style="background: #2e6f40; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer;">🔄 Refresh Data</button>
        </div>

        <!-- Tabel Data -->
        <div style="background: #fff; border-radius: 10px; overflow-x: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eee;">
            <table style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr style="background-color: #1b4d2e; color: white;">
                        <th style="padding: 12px 15px;">Waktu</th>
                        <th style="padding: 12px 15px;">Nama</th>
                        <th style="padding: 12px 15px;">No. HP</th>
                        <th style="padding: 12px 15px;">Kategori</th>
                        <th style="padding: 12px 15px;">Pesan</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 20px; color: #777;">Memuat data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // MASUKKAN PASSWORD ADMIN YANG ANDA INGINKAN DI SINI
        const PASSWORD_BENAR = "asyifa"; 

        // MASUKKAN URL WEB APP GOOGLE SCRIPT ANDA DI SINI
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwoO-bZ-iEacDP_2IClbaxFQJeONFlL828PXCHUfv0g5wlwZxvJKACd-2P8ijaX6ary/exec';

        // Fungsi Validasi Password
        function checkPassword(event) {
            event.preventDefault();
            const inputPass = document.getElementById('adminPassword').value;

            if (inputPass === PASSWORD_BENAR) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                document.getElementById('btnLogout').style.display = 'block';
                loadData(); // Ambil data dari Google Sheets
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        // Fungsi Ambil Data dari Google Sheets
        function loadData() {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 20px;">Sedang mengambil data dari database...</td></tr>`;

            fetch(scriptURL)
                .then(response => response.json())
                .then(data => {
                    if (data.length === 0) {
                        tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 20px;">Belum ada pesan yang masuk.</td></tr>`;
                        return;
                    }

                    let html = '';
                    // Urutkan agar pesan terbaru berada di paling atas
                    data.reverse().forEach(row => {
                        html += `
                            <tr style="border-bottom: 1px solid #eee;">
                                <td style="padding: 12px 15px; font-size: 0.85rem; color: #666;">${row[0] || '-'}</td>
                                <td style="padding: 12px 15px; font-weight: 600;">${row[1] || '-'}</td>
                                <td style="padding: 12px 15px;">${row[2] || '-'}</td>
                                <td style="padding: 12px 15px;"><span style="background: #eaf3ed; color: #1b4d2e; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem;">${row[3] || '-'}</span></td>
                                <td style="padding: 12px 15px; color: #444;">${row[4] || '-'}</td>
                            </tr>
                        `;
                    });
                    tableBody.innerHTML = html;
                })
                .catch(error => {
                    console.error('Error:', error);
                    tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: red; padding: 20px;">Gagal memuat data dari database. Periksa URL Apps Script Anda.</td></tr>`;
                });
        }

        // Fungsi Logout
        function logout() {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('adminContent').style.display = 'none';
            document.getElementById('btnLogout').style.display = 'none';
            document.getElementById('adminPassword').value = '';
            document.getElementById('errorMsg').style.display = 'none';
        }
    </script>
</body>
</html>
